<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ledger — Task List</title>
<style>
  :root {
    --ink: #1c2430;
    --ink-soft: #4a5568;
    --paper: #f7f5f0;
    --paper-line: #dcd6c8;
    --rule: #c9c2ae;
    --brass: #8a6d3b;
    --brass-deep: #6b5228;
    --done: #7d8570;
    --danger: #9c4a3f;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background: var(--paper);
    background-image:
      linear-gradient(var(--paper-line) 1px, transparent 1px);
    background-size: 100% 2.15em;
    font-family: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
    color: var(--ink);
    display: flex;
    justify-content: center;
    padding: 3.2em 1.2em;
  }

  .sheet {
    width: 100%;
    max-width: 620px;
  }

  header {
    margin-bottom: 1.4em;
    padding-bottom: 1em;
    border-bottom: 2px solid var(--ink);
  }

  h1 {
    font-size: 1.9rem;
    font-weight: 600;
    letter-spacing: 0.01em;
    margin: 0 0 0.15em 0;
  }

  .tally {
    font-family: 'Courier New', monospace;
    font-size: 0.85rem;
    color: var(--ink-soft);
  }

  form {
    display: flex;
    gap: 0.6em;
    margin: 1.4em 0 1.6em 0;
  }

  #task-input {
    flex: 1;
    padding: 0.6em 0.2em;
    border: none;
    border-bottom: 1.5px solid var(--rule);
    background: transparent;
    font-family: inherit;
    font-size: 1.05rem;
    color: var(--ink);
    outline: none;
    transition: border-color 0.15s ease;
  }

  #task-input:focus { border-bottom-color: var(--brass); }
  #task-input::placeholder { color: #a39d8c; font-style: italic; }

  #add-btn {
    padding: 0.6em 1.3em;
    background: var(--ink);
    color: var(--paper);
    border: none;
    font-family: inherit;
    font-size: 0.95rem;
    cursor: pointer;
    transition: background 0.15s ease;
  }

  #add-btn:hover { background: var(--brass-deep); }

  ul#task-list {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  li.task {
    display: flex;
    align-items: flex-start;
    gap: 0.75em;
    padding: 0.55em 0;
    border-bottom: 1px solid var(--paper-line);
  }

  .check {
    flex-shrink: 0;
    width: 1.15em;
    height: 1.15em;
    margin-top: 0.25em;
    border: 1.5px solid var(--ink-soft);
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  .check:hover { border-color: var(--brass); }

  .check.checked {
    background: var(--done);
    border-color: var(--done);
  }

  .check.checked::after {
    content: "✓";
    color: var(--paper);
    font-size: 0.72em;
    line-height: 1;
  }

  .task-text {
    flex: 1;
    font-size: 1.05rem;
    line-height: 1.5em;
    padding-top: 0.1em;
    word-break: break-word;
    cursor: text;
  }

  .task-text.done {
    color: var(--done);
    text-decoration: line-through;
    text-decoration-color: var(--done);
  }

  .task-text[contenteditable="true"] {
    outline: none;
    border-bottom: 1px dashed var(--brass);
  }

  .task-actions {
    display: flex;
    gap: 0.4em;
    opacity: 0;
    transition: opacity 0.15s ease;
  }

  li.task:hover .task-actions,
  li.task:focus-within .task-actions { opacity: 1; }

  .icon-btn {
    background: none;
    border: none;
    cursor: pointer;
    font-family: inherit;
    font-size: 0.8rem;
    color: var(--ink-soft);
    padding: 0.2em 0.35em;
    text-decoration: underline;
    text-underline-offset: 2px;
  }

  .icon-btn:hover { color: var(--ink); }
  .icon-btn.delete:hover { color: var(--danger); }

  .empty-state {
    padding: 2.2em 0;
    text-align: center;
    color: var(--ink-soft);
    font-style: italic;
    font-size: 1rem;
  }

  footer {
    margin-top: 1.6em;
    text-align: right;
  }

  #clear-done {
    background: none;
    border: none;
    font-family: inherit;
    font-size: 0.85rem;
    color: var(--ink-soft);
    text-decoration: underline;
    text-underline-offset: 2px;
    cursor: pointer;
  }

  #clear-done:hover { color: var(--danger); }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<div class="sheet">
  <header>
    <h1>Today's Ledger</h1>
    <div class="tally" id="tally">0 open · 0 done</div>
  </header>

  <form id="add-form">
    <input type="text" id="task-input" placeholder="Enter a task…" autocomplete="off" maxlength="200">
    <button type="submit" id="add-btn">Add</button>
  </form>

  <ul id="task-list"></ul>

  <footer>
    <button id="clear-done">Clear completed</button>
  </footer>
</div>

<script>
(function () {
  const STORAGE_KEY = 'ledger-tasks-v1';

  const listEl = document.getElementById('task-list');
  const formEl = document.getElementById('add-form');
  const inputEl = document.getElementById('task-input');
  const tallyEl = document.getElementById('tally');
  const clearDoneEl = document.getElementById('clear-done');

  function loadTasks() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      console.error('Could not read saved tasks:', e);
      return [];
    }
  }

  function saveTasks(tasks) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    } catch (e) {
      console.error('Could not save tasks:', e);
    }
  }

  let tasks = loadTasks();

  function uid() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  }

  function render() {
    listEl.innerHTML = '';

    if (tasks.length === 0) {
      const empty = document.createElement('li');
      empty.className = 'empty-state';
      empty.textContent = 'Nothing on the ledger yet. Add your first task above.';
      listEl.appendChild(empty);
    } else {
      tasks.forEach(task => {
        const li = document.createElement('li');
        li.className = 'task';
        li.dataset.id = task.id;

        const check = document.createElement('div');
        check.className = 'check' + (task.done ? ' checked' : '');
        check.title = task.done ? 'Mark as not done' : 'Mark as done';
        check.addEventListener('click', () => toggleDone(task.id));

        const text = document.createElement('div');
        text.className = 'task-text' + (task.done ? ' done' : '');
        text.textContent = task.text;
        text.title = 'Click to edit';
        text.addEventListener('click', () => startEdit(text, task.id));

        const actions = document.createElement('div');
        actions.className = 'task-actions';

        const editBtn = document.createElement('button');
        editBtn.className = 'icon-btn';
        editBtn.textContent = 'Edit';
        editBtn.addEventListener('click', () => startEdit(text, task.id));

        const delBtn = document.createElement('button');
        delBtn.className = 'icon-btn delete';
        delBtn.textContent = 'Delete';
        delBtn.addEventListener('click', () => deleteTask(task.id));

        actions.appendChild(editBtn);
        actions.appendChild(delBtn);

        li.appendChild(check);
        li.appendChild(text);
        li.appendChild(actions);
        listEl.appendChild(li);
      });
    }

    const openCount = tasks.filter(t => !t.done).length;
    const doneCount = tasks.length - openCount;
    tallyEl.textContent = `${openCount} open · ${doneCount} done`;
  }

  function addTask(text) {
    const trimmed = text.trim();
    if (!trimmed) return;
    tasks.push({ id: uid(), text: trimmed, done: false });
    saveTasks(tasks);
    render();
  }

  function toggleDone(id) {
    const task = tasks.find(t => t.id === id);
    if (task) {
      task.done = !task.done;
      saveTasks(tasks);
      render();
    }
  }

  function deleteTask(id) {
    tasks = tasks.filter(t => t.id !== id);
    saveTasks(tasks);
    render();
  }

  function startEdit(textEl, id) {
    textEl.contentEditable = 'true';
    textEl.focus();

    const range = document.createRange();
    range.selectNodeContents(textEl);
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(range);

    function commit() {
      textEl.contentEditable = 'false';
      const newText = textEl.textContent.trim();
      const task = tasks.find(t => t.id === id);
      if (task) {
        if (newText) {
          task.text = newText;
        } else {
          textEl.textContent = task.text;
        }
        saveTasks(tasks);
      }
      textEl.removeEventListener('blur', commit);
      textEl.removeEventListener('keydown', onKey);
    }

    function onKey(e) {
      if (e.key === 'Enter') {
        e.preventDefault();
        textEl.blur();
      } else if (e.key === 'Escape') {
        const task = tasks.find(t => t.id === id);
        textEl.textContent = task ? task.text : '';
        textEl.blur();
      }
    }

    textEl.addEventListener('blur', commit);
    textEl.addEventListener('keydown', onKey);
  }

  clearDoneEl.addEventListener('click', () => {
    tasks = tasks.filter(t => !t.done);
    saveTasks(tasks);
    render();
  });

  formEl.addEventListener('submit', (e) => {
    e.preventDefault();
    addTask(inputEl.value);
    inputEl.value = '';
    inputEl.focus();
  });

  render();
})();
</script>

</body>
</html>
